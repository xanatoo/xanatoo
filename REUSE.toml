version = 1

# Documentation, documents, style sheets, data and generated icons.
[[annotations]]
path = [
  ".gitignore",
  "*.md",
  "VERSION",
  "flake.lock",
  "docs/**",
  "examples/**",
  "styles/**",
  "research/pdf-layout-corpus.json",
  "icons/svg/**",
  "data/icons/**",
  "mk/android/app/res/**",
  "mk/android/keystore/debug.keystore",
  "mk/r36s/port.json",
  "website/images/**",
]
SPDX-FileCopyrightText = "2026 Ingo Ruhnke <grumbel@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Vendored Dear ImGui (external/imgui/LICENSE.txt).
[[annotations]]
path = "external/imgui/**"
SPDX-FileCopyrightText = "2014-2025 Omar Cornut"
SPDX-License-Identifier = "MIT"

# Vendored stb_image (license at the end of the file).
[[annotations]]
path = "external/stb_image.h"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

[[annotations]]
path = "external/README.md"
SPDX-FileCopyrightText = "2026 Ingo Ruhnke <grumbel@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Bundled DejaVu fonts (data/fonts/LICENSE-DejaVu.txt).
[[annotations]]
path = "data/fonts/*.ttf"
SPDX-FileCopyrightText = "2003 Bitstream, Inc.; DejaVu changes are in the public domain"
SPDX-License-Identifier = "Bitstream-Vera"

# Bundled Latin Modern Math (data/fonts/LICENSE-LatinModernMath.txt): GUST
# Font License = LPPL 1.3c or later plus a non-binding renaming request.
[[annotations]]
path = "data/fonts/latinmodern-math.otf"
SPDX-FileCopyrightText = "2012-2014 B. Jackowski, P. Strzelczyk and P. Pianowski (GUST e-foundry, on behalf of TeX users groups)"
SPDX-License-Identifier = "LPPL-1.3c+"

# Vendored stb_vorbis (license at the end of the file).
[[annotations]]
path = "external/stb_vorbis.c"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

# Vendored dr_libs decoders (license at the end of each file); dr_mp3
# embeds minimp3 (CC0).
[[annotations]]
path = ["external/dr_flac.h", "external/dr_wav.h"]
SPDX-FileCopyrightText = "2023 David Reid"
SPDX-License-Identifier = "Unlicense OR MIT-0"

[[annotations]]
path = "external/dr_mp3.h"
SPDX-FileCopyrightText = ["2023 David Reid", "lieff (minimp3)"]
SPDX-License-Identifier = "(Unlicense OR MIT-0) AND CC0-1.0"

# Generated test media (tones, solid-colour clips).
[[annotations]]
path = ["tests/data/audio/**", "tests/data/video/**"]
SPDX-FileCopyrightText = "2026 Ingo Ruhnke <grumbel@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"
