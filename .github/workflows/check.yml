#
# gamepkgstd FLAKE-14: all builds/tests are defined in flake.nix. CI runs
# flake check. Downloadable packages are built by artifacts.yml.

name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # self.revCount for the version string (VER-5)
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
