#
# Build each target's release assets (`.#release-<target>`, nix/site.nix)
# independently. A failing target
# does not cancel the others (fail-fast: false), but it does turn the run red.
#
# Every run uploads its successful builds as Actions artifacts. On master
# (push or manual run) each successful target also replaces its own assets
# on the rolling `continuous` release (`nix run .#publish-build`) and asks the
# website to redeploy, so a download goes live minutes after its build.
# A failed target leaves its previous release assets, and so its previous
# download on the website, in place.
#
# Website trigger: the repository secret SITE_DISPATCH_TOKEN, a fine-grained
# token for xanatoo/xanatoo.github.io with "Actions: read and write". Without
# it the release is still updated and the site picks it up on its next run
# (push or nightly).

name: artifacts

on:
  push:
    branches: [master]
    paths-ignore: ["website/**"]   # page-only edits: website.yml
  pull_request:
    paths-ignore: ["website/**"]
  workflow_dispatch:

env:
  RELEASE_TAG: continuous

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release assets (master only, see "Publish")
    strategy:
      # One target failing must not cancel the rest of the matrix.
      fail-fast: false
      matrix:
        # The name on the release and the website; built as .#release-<target>.
        target: [android, r36s, win64, win32, wasm]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # self.revCount / shortRev for the version string

      # The Android SDK / NDK and the cross toolchains need Nix store space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release-${{ matrix.target }}
        run: |
          nix build -L ".#release-${{ matrix.target }}" --out-link result
          cp -rL result dist
          ls -l dist

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: xanatoo-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish to the ${{ env.RELEASE_TAG }} release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#publish-build -- "$RELEASE_TAG" "${{ matrix.target }}" dist

      - name: Redeploy the website
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN not set; the website picks up the release on its next run."
            exit 0
          fi
          gh workflow run pages.yml -R xanatoo/xanatoo.github.io --ref master \
            || echo "::warning::Could not trigger the website deploy."
