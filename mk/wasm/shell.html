<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xanatoo @XANATOO_VERSION@ — a document workspace</title>
  <style>
    html, body { margin: 0; height: 100%; background: #22292f; color: #e5e8e8;
                 font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: baseline; justify-content: space-between;
             gap: 1rem; padding: .5rem 1rem; }
    header a { color: #a6cfff; }
    #status { font-size: .85rem; opacity: .8; }
    main { flex: 1; min-height: 0; position: relative; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    footer { padding: .35rem 1rem; font-size: .78rem; opacity: .75; }
  </style>
</head>
<body>
  <header><span><strong>Xanatoo @XANATOO_VERSION@</strong> — interactive hypertext</span>
    <span><button id="open" type="button" title="Open a document, PDF, DjVu or comic archive">Open file…</button>
    <input id="file" type="file" hidden>
    <span id="status">Starting…</span></span></header>
  <main><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></main>
  <footer>Preview: local documents and editing; online pages only where the site allows cross-origin requests. Changes are not saved.
    <a href="https://github.com/xanatoo/xanatoo">Source</a></footer>
  <script>
    // Files go into the virtual filesystem and are opened by the app
    // (xanatoo_web_open); nothing leaves the browser.
    function openFile(file) {
      var reader = new FileReader();
      reader.onload = function () {
        try { Module.FS.mkdir('/upload'); } catch (e) {}
        var path = '/upload/' + file.name.replace(/[\\/]/g, '_');
        Module.FS.writeFile(path, new Uint8Array(reader.result));
        Module.ccall('xanatoo_web_open', null, ['string'], [path]);
      };
      reader.readAsArrayBuffer(file);
    }
    var canvas = document.getElementById('canvas');
    var status = document.getElementById('status');
    var Module = {
      canvas: canvas,
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      setStatus: function (text) { status.textContent = text || 'Ready'; },
      onRuntimeInitialized: function () {
        canvas.focus();
        var input = document.getElementById('file');
        document.getElementById('open').onclick = function () { input.click(); };
        input.onchange = function () { if (input.files[0]) openFile(input.files[0]); input.value = ''; };
        canvas.addEventListener('dragover', function (e) { e.preventDefault(); });
        canvas.addEventListener('drop', function (e) {
          e.preventDefault();
          if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]);
        });
      },
      onAbort: function (reason) { status.textContent = 'Error: ' + reason; }
    };

    // Threads (PDF / DjVu reading, network fetches) need a cross-origin
    // isolated page. Where the host cannot send COOP / COEP (GitHub Pages),
    // coi-sw.js adds them: register it, then reload once under its control.
    // The app script stays inert in the template below until then.
    function startApp() {
      var tpl = document.getElementById('app-script');
      document.body.appendChild(document.importNode(tpl.content, true));
    }
    function isolate() {
      var key = 'xanatoo-coi-reload', tried = false;
      try { tried = sessionStorage.getItem(key) === '1'; } catch (e) {}
      if (!window.isSecureContext || !navigator.serviceWorker || tried) {
        status.textContent = 'This browser cannot run the threaded build here ' +
          '(no cross-origin isolation; private windows often block it).';
        return;
      }
      status.textContent = 'Enabling cross-origin isolation…';
      navigator.serviceWorker.register('coi-sw.js').then(function () {
        return navigator.serviceWorker.ready;
      }).then(function () {
        try { sessionStorage.setItem(key, '1'); } catch (e) {}
        location.reload();
      }, function (err) {
        status.textContent = 'Error: could not install coi-sw.js (' + err + ')';
      });
    }
    window.addEventListener('DOMContentLoaded', function () {
      if (self.crossOriginIsolated) {
        try { sessionStorage.removeItem('xanatoo-coi-reload'); } catch (e) {}
        startApp();
      } else {
        isolate();
      }
    });
  </script>
  <template id="app-script">{{{ SCRIPT }}}</template>
</body>
</html>
